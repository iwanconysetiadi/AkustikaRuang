[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-acoustics-colab"
version = "0.1.0"
description = "Physics-first Python models for a one-week building acoustics design challenge"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "ipywidgets>=8.1"]

[tool.setuptools.packages.find]
where = ["src"]
